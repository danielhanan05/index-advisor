name: Build Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: IndexAdvisor-Windows
            archive_name: IndexAdvisor-Windows.zip

          - name: Linux
            os: ubuntu-latest
            artifact_name: IndexAdvisor-Linux
            archive_name: index-advisor-linux.tar.gz

    env:
      PYTHONPATH: backend
      INDEX_ADVISOR_CONFIG_DIR: ./config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/build_release.py --pyinstaller
          Compress-Archive -Path dist/IndexAdvisor -DestinationPath IndexAdvisor-Windows.zip -Force

      - name: Build Linux portable package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python packaging/build_release.py --pyinstaller
          cd dist
          tar -czf ../index-advisor-linux.tar.gz index-advisor
          cd ..

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.zip
            *.tar.gz

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz